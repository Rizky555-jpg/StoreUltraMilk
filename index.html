<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warung Madura Berkah - Lengkap Murah</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #d84315; 
        --secondary: #ffb300; 
        --accent: #2e7d32; 
        --bg: #fbf8f1;
        --text: #1e293b;
        --card-bg: #ffffff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        overflow-x: hidden;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* HEADER */
    header {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        padding: 15px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .logo {
        font-size: 18px;
        font-weight: 800;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .logo span { color: var(--text); }

    .cart-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.3s;
        box-shadow: 0 8px 15px rgba(216, 67, 21, 0.3);
    }

    .cart-btn:hover { transform: scale(1.05); background: #bf360c; }

    .cart-badge {
        background: var(--secondary);
        color: var(--text);
        border-radius: 50%;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 800;
    }

    /* HERO BANNER */
    .hero-banner {
        width: 100%;
        height: 220px;
        background: url('https://images.unsplash.com/photo-1604719312566-8912e9227c6a?q=80&w=1000&auto=format&fit=crop') center/cover;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
        overflow: hidden;
        animation: fadeUp 0.8s ease-out;
    }

    @media (min-width: 768px) { .hero-banner { height: 320px; } }

    .hero-banner::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to right, rgba(216,67,21,0.85), rgba(0,0,0,0.6));
    }

    .hero-content {
        position: relative;
        z-index: 1;
        color: white;
        padding: 20px;
    }

    .hero-content h1 {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 10px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    @media (min-width: 768px) { .hero-content h1 { font-size: 38px; } }

    .hero-content p { font-size: 14px; font-weight: 500; margin-bottom: 15px; }

    .hero-badge {
        display: inline-block;
        background: var(--secondary);
        color: var(--text);
        padding: 8px 20px;
        border-radius: 50px;
        font-weight: 800;
        font-size: 13px;
        box-shadow: 0 10px 20px rgba(255,179,0,0.4);
    }

    /* SEARCH & FILTER */
    .search-container {
        max-width: 800px;
        margin: -25px auto 20px;
        padding: 0 20px;
        position: relative;
        z-index: 10;
        animation: fadeUp 0.8s ease-out 0.2s both;
    }

    .search-box {
        background: white;
        border-radius: 50px;
        padding: 15px 25px;
        display: flex;
        align-items: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 2px solid transparent;
        transition: 0.3s;
    }

    .search-box:focus-within { border-color: var(--primary); }
    .search-box input { border: none; outline: none; width: 100%; font-size: 15px; margin-left: 10px; }

    .categories {
        display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 20px;
        max-width: 1000px; margin: 0 auto; scrollbar-width: none;
        animation: fadeUp 0.8s ease-out 0.3s both;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
        background: white; color: var(--text); border: 1px solid #e2e8f0;
        padding: 10px 20px; border-radius: 50px; font-weight: 600; font-size: 13px;
        white-space: nowrap; cursor: pointer; transition: 0.3s;
    }

    .cat-btn.active {
        background: var(--primary); color: white; border-color: var(--primary);
        box-shadow: 0 6px 15px rgba(216,67,21,0.3);
    }

    /* CONTAINER */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px; }

    .products {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px;
    }

    @media (min-width: 768px) {
        .products { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
    }

    /* KARTU PRODUK */
    .product-card {
        background: var(--card-bg); border-radius: 20px; padding: 15px;
        display: flex; flex-direction: column; position: relative;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;
        animation: fadeUp 0.6s ease-out both;
    }

    .product-card:hover {
        transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        border-color: var(--primary);
    }

    /* BADGE PRODUK */
    .badge {
        position: absolute; top: 15px; left: 15px; padding: 5px 12px;
        border-radius: 20px; font-size: 10px; font-weight: 800; color: white; z-index: 2;
    }
    .badge.bestseller { background: var(--accent); }
    .badge.promo { background: var(--primary); }

    /* GAMBAR PRODUK */
    .img-container {
        height: 140px; display: flex; align-items: center; justify-content: center;
        margin-bottom: 10px; position: relative; background: #f8fafc; border-radius: 15px;
        overflow: hidden;
    }

    @media (min-width: 768px) { .img-container { height: 180px; } }

    .img-container img {
        width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease;
    }

    .product-card:hover .img-container img { transform: scale(1.1); }
    
    /* Fallback Emoji jika gambar error */
    .img-fallback {
        font-size: 60px; display: flex; align-items: center; justify-content: center;
        height: 100%; width: 100%; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15));
    }
    @media (min-width: 768px) { .img-fallback { font-size: 80px; } }

    /* INFO PRODUK */
    .product-info { display: flex; flex-direction: column; flex-grow: 1; }

    .product-info h3 {
        font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.3;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .product-info .desc {
        font-size: 11px; color: #64748b; margin-bottom: 8px; line-height: 1.4; flex-grow: 1;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* TOGGLE SATUAN (ECERAN / GROSIR) */
    .variant-toggle {
        display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; margin-bottom: 10px;
    }

    .variant-btn {
        flex: 1; border: none; background: transparent; padding: 6px 0; border-radius: 8px;
        font-size: 11px; font-weight: 700; color: #64748b; cursor: pointer; transition: 0.3s;
    }

    .variant-btn.active {
        background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .price-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; flex-direction: column; }
    
    .price { font-size: 18px; font-weight: 800; color: var(--primary); }
    
    .price-detail {
        font-size: 10px; color: #64748b; margin-top: 2px; font-weight: 500;
    }

    .add-btn {
        background: #fff3e0; color: var(--primary); border: none; padding: 10px;
        border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;
        transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%;
    }

    .add-btn:hover { background: var(--primary); color: white; }

    /* MODAL KERANJANG */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 999; align-items: flex-end;
    }

    @media (min-width: 768px) { .modal-overlay { align-items: center; justify-content: center; } }
    .modal-overlay.active { display: flex; }

    .modal {
        background: white; width: 100%; max-width: 500px; border-top-left-radius: 30px;
        border-top-right-radius: 30px; max-height: 90vh; display: flex; flex-direction: column;
        animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @media (min-width: 768px) { .modal { border-radius: 30px; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header {
        padding: 20px; border-bottom: 1px solid #f1f5f9; display: flex;
        justify-content: space-between; align-items: center; position: sticky; top: 0;
        background: white; border-radius: 30px 30px 0 0; z-index: 10;
    }

    .modal-header h2 { font-size: 18px; font-weight: 800; color: var(--text); }

    .close-btn {
        background: #f1f5f9; color: #64748b; border: none; width: 35px; height: 35px;
        border-radius: 50%; font-size: 18px; cursor: pointer; display: flex;
        align-items: center; justify-content: center;
    }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

    /* BANNER ONGKIR */
    .shipping-info {
        background: #fff3e0; border: 1px solid #ffe0b2; padding: 12px; border-radius: 12px;
        font-size: 12px; font-weight: 600; color: #e65100; margin-bottom: 15px;
        display: flex; align-items: center; gap: 10px;
    }
    .shipping-info.success {
        background: #e8f5e9; border-color: #c8e6c9; color: var(--accent);
    }

    /* ITEM KERANJANG */
    .cart-item {
        display: flex; gap: 15px; background: white; padding: 15px;
        border-radius: 15px; margin-bottom: 15px; border: 1px solid #f1f5f9; align-items: center;
    }

    .cart-item .cart-img {
        width: 50px; height: 50px; object-fit: cover; border-radius: 8px; background: #f8fafc;
        display: flex; align-items: center; justify-content: center; font-size: 30px;
    }

    .cart-item-info { flex: 1; }
    .cart-item-info h4 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .cart-item-info .variant-label { font-size: 10px; color: #64748b; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px;}
    .cart-item-info .item-price { font-size: 13px; font-weight: 800; color: var(--primary); }

    .qty-controls {
        display: flex; align-items: center; gap: 10px; background: var(--bg);
        padding: 5px; border-radius: 20px;
    }

    .qty-btn {
        background: white; color: var(--primary); border: none; width: 28px; height: 28px;
        border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .qty-num { font-size: 14px; font-weight: 700; min-width: 20px; text-align: center; }

    .empty-cart { text-align: center; padding: 40px 0; color: #94a3b8; }

    /* FORM CHECKOUT */
    .checkout-section { background: #f8fafc; padding: 20px; border-radius: 20px; margin-top: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .form-group input, .form-group textarea {
        width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px;
        font-size: 14px; font-family: 'Poppins', sans-serif; transition: 0.3s; background: white;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }

    /* FOOTER MODAL */
    .modal-footer {
        padding: 20px; border-top: 1px solid #f1f5f9; background: white;
        border-radius: 0 0 30px 30px; position: sticky; bottom: 0; box-shadow: 0 -10px 20px rgba(0,0,0,0.02);
    }

    .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 16px; font-weight: 700; }
    .cart-total span:last-child { font-size: 22px; font-weight: 800; color: var(--primary); }

    .checkout-btn {
        width: 100%; background: #25d366; color: white; border: none; padding: 16px;
        border-radius: 15px; font-size: 16px; font-weight: 800; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        box-shadow: 0 8px 20px rgba(37,211,102,0.3);
    }

    .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(37,211,102,0.4); }

    /* TOAST */
    .toast {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
        background: var(--text); color: white; padding: 12px 24px; border-radius: 50px;
        font-size: 13px; font-weight: 600; z-index: 2000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    footer { text-align: center; padding: 30px; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>

<header>
    <div class="logo">🏪 WARUNG<span>MADURA</span></div>
    <button class="cart-btn" onclick="openCart()">
        🛒 <span class="cart-badge" id="cartCount">0</span>
    </button>
</header>

<section class="hero-banner">
    <div class="hero-content">
        <h1>Warung Madura Berkah<br>Serba Ada, Harga Bersahabat</h1>
        <p>Belanja kebutuhan harian tanpa keluar rumah</p>
        <div class="hero-badge">🚚 GRATIS ONGKIR MIN. 5 BARANG</div>
    </div>
</section>

<div class="search-container">
    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Cari beras, mie, sabun, rokok..." oninput="renderProducts()">
    </div>
</div>

<div class="categories" id="categoryList">
    <button class="cat-btn active" onclick="filterCategory('semua', this)">Semua Barang</button>
    <button class="cat-btn" onclick="filterCategory('sembako', this)">🍚 Sembako</button>
    <button class="cat-btn" onclick="filterCategory('telur', this)">🥚 Telur & Susu</button>
    <button class="cat-btn" onclick="filterCategory('mie', this)">🍜 Mie Instan</button>
    <button class="cat-btn" onclick="filterCategory('kopi', this)">☕ Kopi & Teh</button>
    <button class="cat-btn" onclick="filterCategory('mandi', this)">🧴 Alat Mandi</button>
    <button class="cat-btn" onclick="filterCategory('bumbu', this)">🧂 Bumbu Dapur</button>
    <button class="cat-btn" onclick="filterCategory('camilan', this)">🍿 Camilan</button>
    <button class="cat-btn" onclick="filterCategory('jajanan', this)">🍬 Jajanan Anak</button>
    <button class="cat-btn" onclick="filterCategory('rokok', this)">🚬 Rokok</button>
