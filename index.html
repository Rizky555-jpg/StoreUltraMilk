<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Milk Store - Susu Premium Asli</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #0056b3;
        --secondary: #00a8ff;
        --accent: #ff9f43;
        --bg: #f8fafc;
        --text: #1e293b;
        --card-bg: #ffffff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        overflow-x: hidden;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* HEADER */
    header {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 15px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .logo {
        font-size: 22px;
        font-weight: 800;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: -0.5px;
    }

    .logo span { color: var(--secondary); }

    .cart-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.3s;
        box-shadow: 0 8px 15px rgba(0, 86, 179, 0.3);
    }

    .cart-btn:hover { transform: scale(1.05); background: #004494; }

    .cart-badge {
        background: var(--accent);
        color: white;
        border-radius: 50%;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 800;
        transition: 0.2s;
    }

    /* HERO BANNER (GAMBAR ASLI) */
    .hero-banner {
        width: 100%;
        height: 200px;
        background: url('https://images.unsplash.com/photo-1550583724-b2692b85b150?q=80&w=1000&auto=format&fit=crop') center/cover;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
        overflow: hidden;
        animation: fadeUp 0.8s ease-out;
    }

    @media (min-width: 768px) {
        .hero-banner { height: 350px; }
    }

    .hero-banner::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to bottom, rgba(0,86,179,0.7), rgba(0,0,0,0.6));
    }

    .hero-content {
        position: relative;
        z-index: 1;
        color: white;
        padding: 20px;
    }

    .hero-content h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 10px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
    }

    @media (min-width: 768px) {
        .hero-content h1 { font-size: 42px; }
    }

    .hero-content p {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 15px;
        opacity: 0.9;
    }

    .hero-badge {
        display: inline-block;
        background: var(--accent);
        color: white;
        padding: 8px 20px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 12px;
        box-shadow: 0 10px 20px rgba(255,159,67,0.4);
    }

    /* SEARCH & FILTER */
    .search-container {
        max-width: 800px;
        margin: -25px auto 20px;
        padding: 0 20px;
        position: relative;
        z-index: 10;
        animation: fadeUp 0.8s ease-out 0.2s both;
    }

    .search-box {
        background: white;
        border-radius: 50px;
        padding: 15px 25px;
        display: flex;
        align-items: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 2px solid transparent;
        transition: 0.3s;
    }

    .search-box:focus-within { border-color: var(--secondary); }
    .search-box input {
        border: none; outline: none; width: 100%; font-size: 15px; margin-left: 10px;
    }

    .categories {
        display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 20px;
        max-width: 800px; margin: 0 auto; scrollbar-width: none;
        animation: fadeUp 0.8s ease-out 0.3s both;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
        background: white; color: var(--text); border: 1px solid #e2e8f0;
        padding: 10px 20px; border-radius: 50px; font-weight: 600; font-size: 13px;
        white-space: nowrap; cursor: pointer; transition: 0.3s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.02);
    }

    .cat-btn.active {
        background: var(--primary); color: white; border-color: var(--primary);
        box-shadow: 0 6px 15px rgba(0,86,179,0.3);
    }

    /* CONTAINER */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px; }

    .products {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px;
    }

    @media (min-width: 768px) {
        .products { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
    }

    /* KARTU PRODUK */
    .product-card {
        background: var(--card-bg); border-radius: 20px; padding: 15px;
        display: flex; flex-direction: column; position: relative;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;
        animation: fadeUp 0.6s ease-out both;
    }

    .product-card:hover {
        transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        border-color: var(--secondary);
    }

    /* BADGE PRODUK */
    .badge {
        position: absolute; top: 15px; left: 15px; padding: 5px 12px;
        border-radius: 20px; font-size: 10px; font-weight: 800; color: white; z-index: 2;
    }
    .badge.bestseller { background: #ff4757; }
    .badge.promo { background: var(--accent); }
    .badge.new { background: #2ed573; }

    /* GAMBAR PRODUK (CSS MOCKUP) */
    .img-container {
        height: 150px; display: flex; align-items: center; justify-content: center;
        margin-bottom: 15px; position: relative;
    }

    @media (min-width: 768px) {
        .img-container { height: 200px; }
    }

    /* BOX SUSU 3D */
    .milk-box {
        width: 70px; height: 110px; background: white; border-radius: 5px;
        position: relative; display: flex; align-items: center; justify-content: center;
        box-shadow: -10px 10px 20px rgba(0,0,0,0.15), inset -5px 0 10px rgba(0,0,0,0.05);
        transition: transform 0.4s ease; border: 2px solid #e2e8f0;
        overflow: hidden;
    }

    @media (min-width: 768px) {
        .milk-box { width: 90px; height: 140px; }
    }

    .milk-box::before {
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 20%;
        background: linear-gradient(to bottom, rgba(0,0,0,0.05), transparent);
    }

    .milk-box::after {
        content: ''; position: absolute; bottom: 15%; right: -10px; width: 20px; height: 20px;
        background: rgba(255,255,255,0.5); border-radius: 50%; filter: blur(2px);
    }

    .product-card:hover .milk-box { transform: scale(1.1) rotate(-5deg); }

    .milk-box.original { background: linear-gradient(135deg, #ffffff, #e3f2fd); }
    .milk-box.chocolate { background: linear-gradient(135deg, #8d6e63, #5d4037); }
    .milk-box.strawberry { background: linear-gradient(135deg, #f48fb1, #c2185b); }
    .milk-box.mocha { background: linear-gradient(135deg, #bcaaa4, #795548); }
    .milk-box.vanilla { background: linear-gradient(135deg, #fff9c4, #fbc02d); }
    .milk-box.lowfat { background: linear-gradient(135deg, #c8e6c9, #388e3c); }

    .milk-label {
        background: rgba(255,255,255,0.9); width: 100%; text-align: center;
        padding: 5px 0; font-size: 8px; font-weight: 800; color: var(--primary);
        text-transform: uppercase; transform: rotate(-90deg); letter-spacing: 1px;
    }

    @media (min-width: 768px) {
        .milk-label { font-size: 10px; }
    }

    /* INFO PRODUK */
    .product-info { display: flex; flex-direction: column; flex-grow: 1; }

    .product-info h3 {
        font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.3;
    }

    @media (min-width: 768px) {
        .product-info h3 { font-size: 16px; }
    }

    .product-info .desc {
        font-size: 11px; color: #64748b; margin-bottom: 12px; line-height: 1.4; flex-grow: 1;
    }

    .price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .price { font-size: 16px; font-weight: 800; color: var(--primary); }

    @media (min-width: 768px) {
        .price { font-size: 18px; }
    }

    .old-price { font-size: 11px; color: #cbd5e1; text-decoration: line-through; margin-left: 5px; }

    .add-btn {
        background: #eff6ff; color: var(--primary); border: none; padding: 10px;
        border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;
        transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%;
    }

    .add-btn:hover { background: var(--primary); color: white; }

    /* MODAL KERANJANG */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 999; align-items: flex-end;
    }

    @media (min-width: 768px) {
        .modal-overlay { align-items: center; justify-content: center; }
    }
    .modal-overlay.active { display: flex; }

    .modal {
        background: white; width: 100%; max-width: 500px; border-top-left-radius: 30px;
        border-top-right-radius: 30px; max-height: 90vh; display: flex; flex-direction: column;
        animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @media (min-width: 768px) { .modal { border-radius: 30px; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header {
        padding: 20px; border-bottom: 1px solid #f1f5f9; display: flex;
        justify-content: space-between; align-items: center; position: sticky; top: 0;
        background: white; border-radius: 30px 30px 0 0; z-index: 10;
    }

    .modal-header h2 { font-size: 18px; font-weight: 800; color: var(--text); }

    .close-btn {
        background: #f1f5f9; color: #64748b; border: none; width: 35px; height: 35px;
        border-radius: 50%; font-size: 18px; cursor: pointer; display: flex;
        align-items: center; justify-content: center;
    }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

    /* ITEM KERANJANG */
    .cart-item {
        display: flex; gap: 15px; background: white; padding: 15px;
        border-radius: 15px; margin-bottom: 15px; border: 1px solid #f1f5f9; align-items: center;
    }

    .cart-item .mini-box {
        width: 40px; height: 60px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        display: flex; align-items: center; justify-content: center;
    }

    .cart-item-info { flex: 1; }
    .cart-item-info h4 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .cart-item-info .item-price { font-size: 13px; font-weight: 800; color: var(--primary); }

    .qty-controls {
        display: flex; align-items: center; gap: 10px; background: var(--bg);
        padding: 5px; border-radius: 20px;
    }

    .qty-btn {
        background: white; color: var(--primary); border: none; width: 28px; height: 28px;
        border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .qty-num { font-size: 14px; font-weight: 700; min-width: 20px; text-align: center; }

    .empty-cart { text-align: center; padding: 40px 0; color: #94a3b8; }

    /* FORM CHECKOUT */
    .checkout-section { background: #f8fafc; padding: 20px; border-radius: 20px; margin-top: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .form-group input, .form-group textarea {
        width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px;
        font-size: 14px; font-family: 'Poppins', sans-serif; transition: 0.3s; background: white;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }

    /* FOOTER MODAL */
    .modal-footer {
        padding: 20px; border-top: 1px solid #f1f5f9; background: white;
        border-radius: 0 0 30px 30px; position: sticky; bottom: 0; box-shadow: 0 -10px 20px rgba(0,0,0,0.02);
    }

    .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 16px; font-weight: 700; }
    .cart-total span:last-child { font-size: 22px; font-weight: 800; color: var(--primary); }

    .checkout-btn {
        width: 100%; background: #25d366; color: white; border: none; padding: 16px;
        border-radius: 15px; font-size: 16px; font-weight: 800; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        box-shadow: 0 8px 20px rgba(37,211,102,0.3);
    }

    .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(37,211,102,0.4); }

    /* TOAST */
    .toast {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
        background: var(--text); color: white; padding: 12px 24px; border-radius: 50px;
        font-size: 13px; font-weight: 600; z-index: 2000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    footer { text-align: center; padding: 30px; color: #94a3b8; font-size: 12px; }
</style>
</head>
<body>

<header>
    <div class="logo">🥛 ULTRA<span>MILK</span></div>
    <button class="cart-btn" onclick="openCart()">
        🛒 <span class="cart-badge" id="cartCount">0</span>
    </button>
</header>

<section class="hero-banner">
    <div class="hero-content">
        <h1>Susu Premium<br>Gaya Hidup Sehat</h1>
        <p>100% Susu Sapi Segar Berkualitas Tinggi</p>
        <div class="hero-badge">✨ Gratis Ongkir Min. 10 Pcs ✨</div>
    </div>
</section>

<div class="search-container">
    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Cari varian susu favoritmu..." oninput="renderProducts()">
    </div>
</div>

<div class="categories" id="categoryList">
    <button class="cat-btn active" onclick="filterCategory('semua', this)">Semua Varian</button>
    <button class="cat-btn" onclick="filterCategory('250ml', this)">Kotak 250ml</button>
    <button class="cat-btn" onclick="filterCategory('1L', this)">Kemasan 1 Liter</button>
</div>

<div class="container">
    <div class="products" id="productList"></div>
</div>

<!-- MODAL KERANJANG -->
<div class="modal-overlay" id="cartModal">
    <div class="modal">
        <div class="modal-header">
            <h2>🛒 Keranjang Belanja</h2>
            <button class="close-btn" onclick="closeCart()">✕</button>
        </div>
        <div class="modal-body">
            <div id="cartItems"></div>
            
            <div id="orderForm" class="checkout-section" style="display:none;">
                <h3 style="font-size:14px; margin-bottom:15px; color:var(--text);">Detail Pengiriman</h3>
                <div class="form-group">
                    <label>Nama Penerima</label>
                    <input type="text" id="customerName" placeholder="Masukkan nama lengkap">
                </div>
                <div class="form-group">
                    <label>No. WhatsApp</label>
                    <input type="tel" id="customerPhone" placeholder="Contoh: 08123456789">
                </div>
                <div class="form-group">
                    <label>Alamat Lengkap</label>
                    <textarea id="customerAddress" rows="2" placeholder="Nama jalan, RT/RW, kelurahan, kecamatan"></textarea>
                </div>
                <div class="form-group">
                    <label>Catatan (Opsional)</label>
                    <input type="text" id="customerNote" placeholder="Contoh: Kirim pagi hari">
                </div>
            </div>
        </div>
        
        <div class="modal-footer" id="modalFooter" style="display:none;">
            <div class="cart-total">
                <span>Total Harga:</span>
                <span id="totalPrice">Rp 0</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWA()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                Pesan via WhatsApp
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast">Berhasil!</div>

<footer>
    <p>&copy; 2024 Ultra Milk Store. All rights reserved.</p>
</footer>

<script>
// ================= KONFIGURASI =================
const WHATSAPP_NUMBER = "6285772590983"; 

// ================= DATA PRODUK (PAKAI CSS MOCKUP) =================
const products = [
    { 
        id: 1, 
        name: "Ultra Milk Original 250ml", 
        desc: "Susu murni segar tanpa rasa tambahan.", 
        price: 6500, 
        oldPrice: 7500,
        category: "250ml",
        badge: "bestseller",
        colorClass: "original"
    },
    { 
        id: 2, 
        name: "Ultra Milk Cokelat 250ml", 
        desc: "Rasa cokelat premium yang disukai anak-anak.", 
        price: 6800, 
        category: "250ml",
        badge: "promo",
        colorClass: "chocolate"
    },
    { 
        id: 3, 
        name: "Ultra Milk Stroberi 250ml", 
        desc: "Manisnya stroberi asli berpadu dengan susu segar.", 
        price: 6800, 
        category: "250ml",
        colorClass: "strawberry"
    },
    { 
        id: 4, 
        name: "Ultra Milk Moka 250ml", 
        desc: "Perpaduan kopi moka dan susu yang elegan.", 
        price: 7000, 
        category: "250ml",
        colorClass: "mocha"
    },
    { 
        id: 5, 
        name: "Ultra Milk Vanila 250ml", 
        desc: "Aroma vanila lembut yang menenangkan.", 
        price: 6800, 
        category: "250ml",
        badge: "new",
        colorClass: "vanilla"
    },
    { 
        id: 6, 
        name: "Ultra Milk Low Fat 250ml", 
        desc: "Rendah lemak, cocok untuk diet sehat.", 
        price: 7200, 
        category: "250ml",
        colorClass: "lowfat"
    },
    { 
        id: 7, 
        name: "Ultra Milk Full Cream 1L", 
        desc: "Kemasan besar, hemat untuk keluarga.", 
        price: 19500, 
        oldPrice: 22000,
        category: "1L",
        badge: "bestseller",
        colorClass: "original"
    },
    { 
        id: 8, 
        name: "Ultra Milk Cokelat 1L", 
        desc: "Cokelat melimpah dalam kemasan 1 liter.", 
        price: 21000, 
        category: "1L",
        colorClass: "chocolate"
    },
];

let cart = JSON.parse(localStorage.getItem('ultraCartV3')) || [];
let currentCategory = 'semua';

// ================= RENDER PRODUK =================
function renderProducts() {
    const list = document.getElementById('productList');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = products.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(searchTerm);
        const matchCat = currentCategory === 'semua' || p.category === currentCategory;
        return matchSearch && matchCat;
    });

    if (filtered.length === 0) {
        list.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">Produk tidak ditemukan 😔</div>`;
        return;
    }

    list.innerHTML = filtered.map((p, index) => {
        let badgeHtml = '';
        if (p.badge === 'bestseller') badgeHtml = '<div class="badge bestseller">🔥 BEST SELLER</div>';
        if (p.badge === 'promo') badgeHtml = '<div class="badge promo">⚡ PROMO</div>';
        if (p.badge === 'new') badgeHtml = '<div class="badge new">✨ BARU</div>';

        let oldPriceHtml = p.oldPrice ? `<span class="old-price">Rp ${p.oldPrice.toLocaleString('id-ID')}</span>` : '';

        return `
        <div class="product-card" style="animation-delay: ${index * 0.05}s">
            ${badgeHtml}
            <div class="img-container">
                <!-- Ini Gambar Kotak Susu Pakai CSS, Dijamin Muncul! -->
                <div class="milk-box ${p.colorClass}">
                    <div class="milk-label">ULTRA MILK</div>
                </div>
            </div>
            <div class="product-info">
                <h3>${p.name}</h3>
                <p class="desc">${p.desc}</p>
                <div class="price-row">
                    <div>
                        <span class="price">Rp ${p.price.toLocaleString('id-ID')}</span>
                        ${oldPriceHtml}
                    </div>
                </div>
                <button class="add-btn" onclick="addToCart(${p.id})">
                    <span>+</span> Tambah
                </button>
            </div>
        </div>
        `;
    }).join('');
}

// ================= FILTER KATEGORI =================
function filterCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts();
}

// ================= LOGIKA KERANJANG =================
function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({ ...product, qty: 1 });
    }

    saveCart();
    updateCartCount();
    showToast(`✅ ${product.name} masuk keranjang!`);
}

function saveCart() {
    localStorage.setItem('ultraCartV3', JSON.stringify(cart));
}

function updateCartCount() {
    const count = cart.reduce((sum, item) => sum + item.qty, 0);
    const badge = document.getElementById('cartCount');
    badge.textContent = count;
    badge.style.transform = 'scale(1.5)';
    setTimeout(() => badge.style.transform = 'scale(1)', 200);
}

function renderCart() {
    const cartItems = document.getElementById('cartItems');
    const orderForm = document.getElementById('orderForm');
    const modalFooter = document.getElementById('modalFooter');
    const totalPriceEl = document.getElementById('totalPrice');

    if (cart.length === 0) {
        cartItems.innerHTML = `
            <div class="empty-cart">
                <div style="font-size:50px; margin-bottom:10px;">🛒</div>
                <h3>Keranjang masih kosong</h3>
                <p style="font-size:12px; margin-top:5px;">Yuk pilih susu favoritmu!</p>
            </div>
        `;
        orderForm.style.display = 'none';
        modalFooter.style.display = 'none';
        return;
    }

    cartItems.innerHTML = cart.map(item => `
        <div class="cart-item">
            <div class="mini-box ${item.colorClass}" style="padding:2px; text-align:center; font-size:6px; font-weight:800; color:var(--primary);">ULTRA</div>
            <div class="cart-item-info">
                <h4>${item.name}</h4>
                <div class="item-price">Rp ${item.price.toLocaleString('id-ID')}</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
                <span class="qty-num">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
        </div>
    `).join('');

    orderForm.style.display = 'block';
    modalFooter.style.display = 'block';

    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    totalPriceEl.textContent = `Rp ${total.toLocaleString('id-ID')}`;
}

function changeQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (!item) return;

    item.qty += delta;
    if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
    }
    saveCart();
    updateCartCount();
    renderCart();
}

// ================= MODAL CONTROL =================
function openCart() {
    document.getElementById('cartModal').classList.add('active');
    document.body.style.overflow = 'hidden';
    renderCart();
}

function closeCart() {
    document.getElementById('cartModal').classList.remove('active');
    document.body.style.overflow = 'auto';
}

document.getElementById('cartModal').addEventListener('click', (e) => {
    if (e.target.id === 'cartModal') closeCart();
});

// ================= CHECKOUT WHATSAPP =================
function checkoutWA() {
    const name = document.getElementById('customerName').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const address = document.getElementById('customerAddress').value.trim();
    const note = document.getElementById('customerNote').value.trim();

    if (!name || !phone || !address) {
        showToast('⚠️ Lengkapi Nama, WA, dan Alamat!');
        return;
    }

    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    const orderId = 'UM-' + Date.now().toString().slice(-6);
    const date = new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });

    let message = `*🛒 PESANAN BARU - ULTRA MILK STORE*%0A`;
    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `*Order ID:* ${orderId}%0A`;
    message += `*Tanggal:* ${date}%0A`;
    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `*📋 DATA PEMBELI:*%0A`;
    message += `• Nama: ${name}%0A`;
    message += `• No. WA: ${phone}%0A`;
    message += `• Alamat: ${address}%0A`;
    if (note) message += `• Catatan: ${note}%0A`;
    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `*📦 DETAIL PESANAN:*%0A`;

    cart.forEach((item, i) => {
        message += `${i + 1}. ${item.name}%0A`;
        message += `   ${item.qty} pcs × Rp ${item.price.toLocaleString('id-ID')} = *Rp ${(item.price * item.qty).toLocaleString('id-ID')}*%0A`;
    });

    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `*💰 TOTAL BAYAR: Rp ${total.toLocaleString('id-ID')}*%0A`;
    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `Mohon konfirmasi pesanan saya ya kak. Terima kasih! 🙏`;

    const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
    window.open(waUrl, '_blank');

    showToast('✅ Mengarahkan ke WhatsApp...');

    setTimeout(() => {
        cart = [];
        saveCart();
        updateCartCount();
        closeCart();
        document.getElementById('customerName').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('customerAddress').value = '';
        document.getElementById('customerNote').value = '';
    }, 2000);
}

let toastTimeout;
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerHTML = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

renderProducts();
updateCartCount();
</script>
</body>
</html>
