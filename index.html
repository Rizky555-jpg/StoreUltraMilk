<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berkah Grosir - Sembako Lengkap</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #2e7d32;
        --secondary: #ffb300;
        --accent: #d32f2f;
        --bg: #f4f7f6;
        --text: #1e293b;
        --card-bg: #ffffff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background-color: var(--bg);
        color: var(--text);
        overflow-x: hidden;
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* HEADER */
    header {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        padding: 15px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .logo {
        font-size: 20px;
        font-weight: 800;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .logo span { color: var(--secondary); }

    .cart-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.3s;
        box-shadow: 0 8px 15px rgba(46, 125, 50, 0.3);
    }

    .cart-btn:hover { transform: scale(1.05); background: #1b5e20; }

    .cart-badge {
        background: var(--accent);
        color: white;
        border-radius: 50%;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 800;
    }

    /* HERO BANNER */
    .hero-banner {
        width: 100%;
        height: 220px;
        background: url('https://images.unsplash.com/photo-1604719312566-8912e9227c6a?q=80&w=1000&auto=format&fit=crop') center/cover;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
        overflow: hidden;
        animation: fadeUp 0.8s ease-out;
    }

    @media (min-width: 768px) { .hero-banner { height: 350px; } }

    .hero-banner::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to right, rgba(27,94,32,0.85), rgba(0,0,0,0.6));
    }

    .hero-content {
        position: relative;
        z-index: 1;
        color: white;
        padding: 20px;
    }

    .hero-content h1 {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 10px;
        text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    }

    @media (min-width: 768px) { .hero-content h1 { font-size: 40px; } }

    .hero-content p { font-size: 14px; font-weight: 500; margin-bottom: 15px; }

    .hero-badge {
        display: inline-block;
        background: var(--secondary);
        color: #1b5e20;
        padding: 8px 20px;
        border-radius: 50px;
        font-weight: 800;
        font-size: 13px;
        box-shadow: 0 10px 20px rgba(255,179,0,0.4);
    }

    /* SEARCH & FILTER */
    .search-container {
        max-width: 800px;
        margin: -25px auto 20px;
        padding: 0 20px;
        position: relative;
        z-index: 10;
        animation: fadeUp 0.8s ease-out 0.2s both;
    }

    .search-box {
        background: white;
        border-radius: 50px;
        padding: 15px 25px;
        display: flex;
        align-items: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: 2px solid transparent;
        transition: 0.3s;
    }

    .search-box:focus-within { border-color: var(--primary); }
    .search-box input { border: none; outline: none; width: 100%; font-size: 15px; margin-left: 10px; }

    .categories {
        display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 20px;
        max-width: 800px; margin: 0 auto; scrollbar-width: none;
        animation: fadeUp 0.8s ease-out 0.3s both;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
        background: white; color: var(--text); border: 1px solid #e2e8f0;
        padding: 10px 20px; border-radius: 50px; font-weight: 600; font-size: 13px;
        white-space: nowrap; cursor: pointer; transition: 0.3s;
    }

    .cat-btn.active {
        background: var(--primary); color: white; border-color: var(--primary);
        box-shadow: 0 6px 15px rgba(46,125,50,0.3);
    }

    /* CONTAINER */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 50px; }

    .products {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px;
    }

    @media (min-width: 768px) {
        .products { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
    }

    /* KARTU PRODUK */
    .product-card {
        background: var(--card-bg); border-radius: 20px; padding: 15px;
        display: flex; flex-direction: column; position: relative;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;
        animation: fadeUp 0.6s ease-out both;
    }

    .product-card:hover {
        transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        border-color: var(--primary);
    }

    /* BADGE PRODUK */
    .badge {
        position: absolute; top: 15px; left: 15px; padding: 5px 12px;
        border-radius: 20px; font-size: 10px; font-weight: 800; color: white; z-index: 2;
    }
    .badge.bestseller { background: var(--primary); }
    .badge.promo { background: var(--accent); }

    /* GAMBAR PRODUK */
    .img-container {
        height: 150px; display: flex; align-items: center; justify-content: center;
        margin-bottom: 10px; position: relative; background: #f8fafc; border-radius: 15px;
        overflow: hidden;
    }

    @media (min-width: 768px) { .img-container { height: 200px; } }

    .img-container img {
        width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease;
    }

    .product-card:hover .img-container img { transform: scale(1.1); }

    /* INFO PRODUK */
    .product-info { display: flex; flex-direction: column; flex-grow: 1; }

    .product-info h3 {
        font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.3;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .product-info .desc {
        font-size: 11px; color: #64748b; margin-bottom: 8px; line-height: 1.4; flex-grow: 1;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* TOGGLE SATUAN (ECERAN / GROSIR) */
    .variant-toggle {
        display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px; margin-bottom: 10px;
    }

    .variant-btn {
        flex: 1; border: none; background: transparent; padding: 6px 0; border-radius: 8px;
        font-size: 11px; font-weight: 700; color: #64748b; cursor: pointer; transition: 0.3s;
    }

    .variant-btn.active {
        background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .price-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; flex-direction: column; }
    
    .price { font-size: 18px; font-weight: 800; color: var(--primary); }
    
    .price-detail {
        font-size: 10px; color: #64748b; margin-top: 2px; font-weight: 500;
    }

    .satuan { font-size: 11px; color: #94a3b8; display: block; font-weight: 500; }

    .add-btn {
        background: #e8f5e9; color: var(--primary); border: none; padding: 10px;
        border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;
        transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%;
    }

    .add-btn:hover { background: var(--primary); color: white; }

    /* MODAL KERANJANG */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 999; align-items: flex-end;
    }

    @media (min-width: 768px) { .modal-overlay { align-items: center; justify-content: center; } }
    .modal-overlay.active { display: flex; }

    .modal {
        background: white; width: 100%; max-width: 500px; border-top-left-radius: 30px;
        border-top-right-radius: 30px; max-height: 90vh; display: flex; flex-direction: column;
        animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @media (min-width: 768px) { .modal { border-radius: 30px; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header {
        padding: 20px; border-bottom: 1px solid #f1f5f9; display: flex;
        justify-content: space-between; align-items: center; position: sticky; top: 0;
        background: white; border-radius: 30px 30px 0 0; z-index: 10;
    }

    .modal-header h2 { font-size: 18px; font-weight: 800; color: var(--text); }

    .close-btn {
        background: #f1f5f9; color: #64748b; border: none; width: 35px; height: 35px;
        border-radius: 50%; font-size: 18px; cursor: pointer; display: flex;
        align-items: center; justify-content: center;
    }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }

    /* BANNER ONGKIR */
    .shipping-info {
        background: #fff3e0; border: 1px solid #ffe0b2; padding: 12px; border-radius: 12px;
        font-size: 12px; font-weight: 600; color: #e65100; margin-bottom: 15px;
        display: flex; align-items: center; gap: 10px;
    }
    .shipping-info.success {
        background: #e8f5e9; border-color: #c8e6c9; color: var(--primary);
    }

    /* ITEM KERANJANG */
    .cart-item {
        display: flex; gap: 15px; background: white; padding: 15px;
        border-radius: 15px; margin-bottom: 15px; border: 1px solid #f1f5f9; align-items: center;
    }

    .cart-item img {
        width: 50px; height: 50px; object-fit: cover; border-radius: 8px; background: #f8fafc;
    }

    .cart-item-info { flex: 1; }
    .cart-item-info h4 { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .cart-item-info .variant-label { font-size: 10px; color: #64748b; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px;}
    .cart-item-info .item-price { font-size: 13px; font-weight: 800; color: var(--primary); }

    .qty-controls {
        display: flex; align-items: center; gap: 10px; background: var(--bg);
        padding: 5px; border-radius: 20px;
    }

    .qty-btn {
        background: white; color: var(--primary); border: none; width: 28px; height: 28px;
        border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .qty-num { font-size: 14px; font-weight: 700; min-width: 20px; text-align: center; }

    .empty-cart { text-align: center; padding: 40px 0; color: #94a3b8; }

    /* FORM CHECKOUT */
    .checkout-section { background: #f8fafc; padding: 20px; border-radius: 20px; margin-top: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .form-group input, .form-group textarea {
        width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px;
        font-size: 14px; font-family: 'Poppins', sans-serif; transition: 0.3s; background: white;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }

    /* FOOTER MODAL */
    .modal-footer {
        padding: 20px; border-top: 1px solid #f1f5f9; background: white;
        border-radius: 0 0 30px 30px; position: sticky; bottom: 0; box-shadow: 0 -10px 20px rgba(0,0,0,0.02);
    }

    .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 16px; font-weight: 700; }
    .cart-total span:last-child { font-size: 22px; font-weight: 800; color: var(--primary); }

    .checkout-btn {
        width: 100%; background: #25d366; color: white; border: none; padding: 16px;
        border-radius: 15px; font-size: 16px; font-weight: 800; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
        box-shadow: 0 8px 20px rgba(37,211,102,0.3);
    }

    .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(37,211,102,0.4); }

    /* TOAST */
    .toast {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
        background: var(--text); color: white; padding: 12px 24px; border-radius: 50px;
        font-size: 13px; font-weight: 600; z-index: 2000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    footer { text-align: center; padding: 30px; color: #94a3b8; font-size: 12px; }
</style>
</head>

<header>

</div>

<div class="container">

</div>

<!-- MODAL KERANJANG -->
<div class="modal-overlay" id="cartModal">

                <div class="form-group">
                    <label>Catatan (Opsional)</label>
                    <input type="text" id="customerNote" placeholder="Contoh: Beras jangan yang keras">
                </div>
            </div>
        </div>
        
        <div class="modal-footer" id="modalFooter" style="display:none;">
            <div class="cart-total">
                <span>Total Harga:</span>

    </div>
</div>

<div class="toast" id="toast">Berhasil!</div>

<footer>
    <p>&copy; 2024 Berkah Grosir. All rights reserved.</p>
</footer>

    {

        name: "Susu Ultra Milk", 
        desc: "Susu UHT Full Cream segar berkualitas.",
        category: "telur",
        badge: "new",
        eceran: { price: 6000, unit: "1 Kotak 250ml", img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?q=80&w=500&auto=format&fit=crop" },
        grosir: { price: 210000, unit: "Karton (12x1L)", img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?q=80&w=500&auto=format&fit=crop" }
    },
    { 
        id: 8, 
        name: "Kopi Kapal Api Special", 
        desc: "Kopi bubuk robusta mantap pengusir ngantuk.",
        category: "mie",
        eceran: { price: 2000, unit: "Sachet", img: "https://images.unsplash.com/photo-1559525839-b184a4d698c7?q=80&w=500&auto=format&fit=crop" },
        grosir: { price: 14000, unit: "Bungkus 165g", img: "https://images.unsplash.com/photo-1559525839-b184a4d698c7?q=80&w=500&auto=format&fit=crop" }
    },
];

let cart = JSON.parse(localStorage.getItem('grosirCartV2')) || [];
let currentCategory = 'semua';

// ================= RENDER PRODUK =================
function renderProducts() {
    const list = document.getElementById('productList');
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = products.filter(p => {
        const matchSearch = p.name.toLowerCase().includes(searchTerm);
        const matchCat = currentCategory === 'semua' || p.category === currentCategory;
        return matchSearch && matchCat;
    });

    if (filtered.length === 0) {
        list.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#94a3b8;">Barang tidak ditemukan 😔</div>`;
        return;
    }

    list.innerHTML = filtered.map((p, index) => {
        let badgeHtml = '';
        if (p.badge === 'bestseller') badgeHtml = '<div class="badge bestseller">🔥 TERLARIS</div>';
        if (p.badge === 'promo') badgeHtml = '<div class="badge promo">⚡ PROMO</div>';
        if (p.badge === 'new') badgeHtml = '<div class="badge new" style="background:#0288d1">✨ BARU</div>';

        // Emoji fallback jika gambar error
        let fallbackEmoji = '📦';
        if (p.category === 'beras') fallbackEmoji = '🍚';
        if (p.category === 'minyak') fallbackEmoji = '🛢️';
        if (p.category === 'telur') fallbackEmoji = '🥚';
        if (p.category === 'mie') fallbackEmoji = '🍜';

        return `
        <div class="product-card" style="animation-delay: ${index * 0.05}s">
            ${badgeHtml}
            <div class="img-container" id="img-container-${p.id}">
                <!-- Gambar akan di-render via JS -->
            </div>
            <div class="product-info">
                <h3>${p.name}</h3>
                <p class="desc">${p.desc}</p>
                
                <!-- TOMBOL TOGGLE ECERAN / GROSIR -->
                <div class="variant-toggle">
                    <button class="variant-btn active" id="btn-eceran-${p.id}" onclick="switchVariant(${p.id}, 'eceran')">Eceran</button>
                    <button class="variant-btn" id="btn-grosir-${p.id}" onclick="switchVariant(${p.id}, 'grosir')">Grosir</button>
                </div>

                <div class="price-row" id="price-row-${p.id}">
                    <!-- Harga akan di-render via JS -->
                </div>
                <button class="add-btn" onclick="addToCart(${p.id})">
                    <span>+</span> Tambah
                </button>
            </div>
        </div>
        `;
    }).join('');

    // Set default state ke Eceran setelah render
    filtered.forEach(p => switchVariant(p.id, 'eceran'));
}

// ================= LOGIKA TOGGLE VARIAN =================
function switchVariant(id, type) {
    const product = products.find(p => p.id === id);
    if (!product) return;

    // Update tombol
    document.getElementById(`btn-eceran-${id}`).classList.toggle('active', type === 'eceran');
    document.getElementById(`btn-grosir-${id}`).classList.toggle('active', type === 'grosir');

    // Ambil data sesuai tipe
    const data = type === 'eceran' ? product.eceran : product.grosir;

    // Update Gambar
    const imgContainer = document.getElementById(`img-container-${id}`);
    imgContainer.innerHTML = `<img src="${data.img}" alt="${product.name}" loading="lazy" 
        onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'font-size:50px;\\'>${product.category === 'beras' ? '🍚' : product.category === 'minyak' ? '🛢️' : product.category === 'telur' ? '🥚' : '🍜'}</span>';">`;

    // Update Harga
    const priceRow = document.getElementById(`price-row-${id}`);
    priceRow.innerHTML = `
        <span class="price">Rp ${data.price.toLocaleString('id-ID')}</span>
        <span class="price-detail">Per ${data.unit}</span>
    `;

    // Simpan state tipe varian yang dipilih ke dalam DOM (buat dipake pas addToCart)
    document.querySelector(`#btn-eceran-${id}`).closest('.product-card').dataset.selectedVariant = type;
}

// ================= FILTER KATEGORI =================
function filterCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts();
}

// ================= LOGIKA KERANJANG =================
function addToCart(id) {
    const product = products.find(p => p.id === id);
    const card = document.querySelector(`#btn-eceran-${id}`).closest('.product-card');
    const selectedVariant = card.dataset.selectedVariant || 'eceran';
    
    // Ambil data sesuai varian yang dipilih
    const variantData = product[selectedVariant];
    
    // ID unik di keranjang berdasarkan ID produk + varian (misal: 1-eceran)
    const cartItemId = `${product.id}-${selectedVariant}`;

    const existing = cart.find(item => item.cartItemId === cartItemId);

    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({ 
            cartItemId: cartItemId,
            id: product.id,
            name: product.name,
            variant: selectedVariant,
            unit: variantData.unit,
            price: variantData.price,
            img: variantData.img,
            qty: 1 
        });
    }

    saveCart();
    updateCartCount();
    
    const labelVariant = selectedVariant === 'eceran' ? 'Eceran' : 'Grosir';
    showToast(`✅ ${product.name} (${labelVariant}) masuk keranjang!`);
}

function saveCart() {
    localStorage.setItem('grosirCartV2', JSON.stringify(cart));
}

function updateCartCount() {
    const count = cart.reduce((sum, item) => sum + item.qty, 0);
    const badge = document.getElementById('cartCount');
    badge.textContent = count;
    badge.style.transform = 'scale(1.5)';
    setTimeout(() => badge.style.transform = 'scale(1)', 200);
}

function renderCart() {
    const cartItems = document.getElementById('cartItems');
    const orderForm = document.getElementById('orderForm');
    const modalFooter = document.getElementById('modalFooter');
    const totalPriceEl = document.getElementById('totalPrice');
    const shippingBanner = document.getElementById('shippingBanner');

    if (cart.length === 0) {
        cartItems.innerHTML = `
            <div class="empty-cart">
                <div style="font-size:50px; margin-bottom:10px;">🛒</div>
                <h3>Keranjang masih kosong</h3>
                <p style="font-size:12px; margin-top:5px;">Yuk pilih sembako murah!</p>
            </div>
        `;
        orderForm.style.display = 'none';
        modalFooter.style.display = 'none';
        shippingBanner.innerHTML = '';
        return;
    }

    // Hitung total QTY untuk syarat gratis ongkir
    const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
    
    // Logika Banner Gratis Ongkir
    if (totalQty >= MIN_FREE_SHIPPING) {
        shippingBanner.innerHTML = `
            <div class="shipping-info success">
                <span>🚚</span> Selamat! Pesanan Anda dapat <b>GRATIS ONGKIR</b>.
            </div>
        `;
    } else {
        const sisa = MIN_FREE_SHIPPING - totalQty;
        shippingBanner.innerHTML = `
            <div class="shipping-info">
                <span>🛍️</span> Beli <b>${sisa} barang lagi</b> untuk dapat GRATIS ONGKIR!
            </div>
        `;
    }

    cartItems.innerHTML = cart.map(item => {
        let fallbackEmoji = '📦';
        if (item.name.includes('Beras')) fallbackEmoji = '🍚';
        if (item.name.includes('Minyak')) fallbackEmoji = '🛢️';
        if (item.name.includes('Telur')) fallbackEmoji = '🥚';
        if (item.name.includes('Indomie')) fallbackEmoji = '🍜';

        return `
        <div class="cart-item">
            <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/50?text=${fallbackEmoji}'">
            <div class="cart-item-info">
                <h4>${item.name}</h4>
                <span class="variant-label">${item.variant === 'eceran' ? 'Eceran' : 'Grosir'} - ${item.unit}</span>
                <div class="item-price">Rp ${item.price.toLocaleString('id-ID')}</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty('${item.cartItemId}', -1)">−</button>
                <span class="qty-num">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty('${item.cartItemId}', 1)">+</button>
            </div>
        </div>
        `;
    }).join('');

    orderForm.style.display = 'block';
    modalFooter.style.display = 'block';

    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    totalPriceEl.textContent = `Rp ${total.toLocaleString('id-ID')}`;
}

function changeQty(cartItemId, delta) {
    const item = cart.find(i => i.cartItemId === cartItemId);
    if (!item) return;

    item.qty += delta;
    if (item.qty <= 0) {
        cart = cart.filter(i => i.cartItemId !== cartItemId);
    }
    saveCart();
    updateCartCount();
    renderCart();
}

// ================= MODAL CONTROL =================
function openCart() {
    document.getElementById('cartModal').classList.add('active');
    document.body.style.overflow = 'hidden';
    renderCart();
}

function closeCart() {
    document.getElementById('cartModal').classList.remove('active');
    document.body.style.overflow = 'auto';
}

document.getElementById('cartModal').addEventListener('click', (e) => {
    if (e.target.id === 'cartModal') closeCart();
});

// ================= CHECKOUT WHATSAPP =================
function checkoutWA() {
    const name = document.getElementById('customerName').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const address = document.getElementById('customerAddress').value.trim();
    const note = document.getElementById('customerNote').value.trim();

    if (!name || !phone || !address) {
        showToast('⚠️ Lengkapi Nama, WA, dan Alamat!');
        return;
    }

    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
    const orderId = 'BG-' + Date.now().toString().slice(-6);
    const date = new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });

    let message = `*🛒 PESANAN BARU - BERKAH GROSIR*%0A`;
    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `*Order ID:* ${orderId}%0A`;
    message += `*Tanggal:* ${date}%0A`;
    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `*📋 DATA PEMBELI:*%0A`;
    message += `• Nama: ${name}%0A`;
    message += `• No. WA: ${phone}%0A`;
    message += `• Alamat: ${address}%0A`;
    if (note) message += `• Catatan: ${note}%0A`;
    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `*📦 DETAIL PESANAN:*%0A`;

    cart.forEach((item, i) => {
        message += `${i + 1}. ${item.name} (${item.variant === 'eceran' ? 'Eceran' : 'Grosir'})%0A`;
        message += `   ${item.qty} x Rp ${item.price.toLocaleString('id-ID')} = *Rp ${(item.price * item.qty).toLocaleString('id-ID')}*%0A`;
    });

    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `*Total Barang:* ${totalQty} pcs%0A`;
    
    // Info Ongkir di WA
    if (totalQty >= MIN_FREE_SHIPPING) {
        message += `*Ongkir:* GRATIS (Min. 5 Barang)%0A`;
    } else {
        message += `*Ongkir:* Belum memenuhi syarat gratis ongkir%0A`;
    }

    message += `*💰 TOTAL BAYAR: Rp ${total.toLocaleString('id-ID')}*%0A`;
    message += `━━━━━━━━━━━━━━━━━━━━%0A`;
    message += `Mohon konfirmasi pesanan saya ya kak. Terima kasih! 🙏`;

    const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
    window.open(waUrl, '_blank');

    showToast('✅ Mengarahkan ke WhatsApp...');

    setTimeout(() => {
        cart = [];
        saveCart();
        updateCartCount();
        closeCart();
        document.getElementById('customerName').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('customerAddress').value = '';
        document.getElementById('customerNote').value = '';
    }, 2000);
}

let toastTimeout;
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerHTML = msg;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

// Mulai render
renderProducts();
updateCartCount();
</script>

</html>
